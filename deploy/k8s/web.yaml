apiVersion: apps/v1
kind: Deployment
metadata:
  name: lastchance-web
  namespace: lastchance
  labels: { app: lastchance-web }
spec:
  replicas: 2
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: lastchance-web }
  template:
    metadata:
      labels: { app: lastchance-web }
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: web
          image: ghcr.io/lastchance/web:latest
          ports: [{ containerPort: 3001 }]
          env:
            # Console talks to the API over the cluster network only.
            - name: BACKEND_URL
              value: http://lastchance-backend.lastchance.svc.cluster.local
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: 500m, memory: 384Mi }
          readinessProbe:
            httpGet: { path: /, port: 3001 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 3001 }
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: lastchance-web
  namespace: lastchance
spec:
  selector: { app: lastchance-web }
  ports: [{ port: 80, targetPort: 3001 }]
