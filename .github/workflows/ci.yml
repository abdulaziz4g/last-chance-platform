# ============================================================================
# Last Chance — CI/CD
# PRs: full verification (types, unit tests, LIVE integration smokes against
#      real PostGIS+Redis service containers, web build, Flutter checks).
# main: everything above + build & push versioned images to GHCR.
# ============================================================================
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: lastchance
          POSTGRES_USER: lastchance
          POSTGRES_PASSWORD: lastchance_dev_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lastchance" --health-interval 5s
          --health-timeout 3s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 12
      opensearch:
        image: opensearchproject/opensearch:2.19.1
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports: ["9200:9200"]
        options: >-
          --health-cmd "curl -sf http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: backend/package-lock.json }

      - name: Apply database migrations
        run: |
          for f in db/migrations/*.sql; do
            echo "== $f"
            PGPASSWORD=lastchance_dev_only psql -h localhost -U lastchance -d lastchance \
              -v ON_ERROR_STOP=1 -q -f "$f"
          done

      # Both suites roll themselves back, so order between them does not
      # matter and neither leaves residue for the integration smokes.
      - name: Database invariant smoke tests
        run: |
          for f in db/tests/*.sql; do
            echo "== $f"
            PGPASSWORD=lastchance_dev_only psql -h localhost -U lastchance -d lastchance \
              -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Install, type-check, unit-test
        working-directory: backend
        run: |
          npm ci
          npx tsc -p tsconfig.json --noEmit
          npx jest --silent

      # SEQUENTIAL, deliberately. Every smoke boots a full AppModule, so each
      # one's BullMQ worker competes with the others for jobs on the same Redis
      # keys — run in parallel they steal each other's work and fail in ways
      # that look like product bugs. They also share one database.
      #
      # Each script exits non-zero on its first failed assertion, and `set -e`
      # is the shell default here, so the job stops at the first red smoke.
      - name: Integration smokes
        working-directory: backend
        env:
          OPENSEARCH_URL: http://localhost:9200
        run: |
          for s in \
            integration-smoke \
            integration-smoke-payments \
            integration-smoke-payout-discount \
            integration-smoke-deals \
            integration-smoke-search \
            integration-smoke-phase6 \
            integration-smoke-moderation \
            integration-smoke-otp
          do
            echo "::group::$s"
            npx ts-node -r reflect-metadata "scripts/$s.ts"
            echo "::endgroup::"
          done

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Type-check, test, build console
        working-directory: web
        run: |
          npm ci
          npx tsc --noEmit
          # The server-action and date-decision tests were being built but
          # never run: `npm run build` proves the app compiles, not that it
          # behaves.
          npm test
          npm run build

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Analyze + test
        working-directory: mobile
        run: |
          flutter pub get
          flutter analyze
          flutter test

  images:
    # Push versioned images only after every verification job is green.
    if: github.ref == 'refs/heads/main'
    needs: [backend, web, mobile]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/web:latest
            ghcr.io/${{ github.repository }}/web:${{ github.sha }}
